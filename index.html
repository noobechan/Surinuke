<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>냥코대전쟁 유닛 통과 이동 속도 계산기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--font-kr:'Jua',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-jp:'Zen Maru Gothic','Hiragino Sans','Yu Gothic',sans-serif;--bg:#f4f6f8;--card:#fff;--line:#d8dde5;--text:#1b1f24;--muted:#657080;--accent:#3568d4;--accent-soft:#eaf0ff;--danger:#b42318;--ok:#067647;--warn:#b54708;--shadow:0 10px 30px rgba(20,28,45,.08);--surface-soft:#fafbfc;--surface-muted:#f7f8fa;--surface-blue:#f6f9ff;--input-bg:#fff;--select-dash:rgba(27,31,36,.42)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-kr);font-variant-numeric:tabular-nums}

html[lang="ko"] body{font-family:var(--font-kr);font-weight:400}
html[lang="ko"] body{
  text-shadow:.08px 0 0 currentColor;
}
html[lang="ko"] input,
html[lang="ko"] select{
  text-shadow:.06px 0 0 currentColor;
}

html[lang="ja"] body{font-family:var(--font-jp)}
html[lang="ja"] .subtitle{font-weight:550}
html[lang="ja"] .title h1{font-size:calc(clamp(20px,3vw,30px) - 1px)}
html[lang="ja"] .subtitle{font-size:12px}


html[lang="ja"] select.dash-selected{font-family:var(--font-kr)}
html[lang="ja"] input::placeholder{font-family:var(--font-kr)}
html[lang="ja"] .form-grid input{font-family:var(--font-kr);font-weight:400}
html[lang="ja"] #comboUsed{font-weight:650}


html[lang="ko"] .title h1,
html[lang="ko"] .card-head h2,
html[lang="ko"] .kb-table th,
html[lang="ko"] button,
html[lang="ko"] .label{font-weight:400}

button,select,input{font-family:inherit}
.seg button{font-family:var(--font-kr)}

#comboUsed{font-size:13px}

.title h1,.card-head h2{letter-spacing:-0.01em}
.title h1{font-weight:700}
.card-head h2{font-weight:700}
.kb-table th{font-weight:700}
.kb-table td,.label,.result .k,.combo-row label{font-weight:500}

/* Prevent mobile browser text autosizing from making selected UI text disproportionately large */
.label{font-size:13px;line-height:1.35}
.result .k{font-size:12px;line-height:1.35}
.notice{font-size:12px;line-height:1.6}
.footer{font-size:12px;line-height:1.4}

.app{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
.topbar{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.title h1{font-size:clamp(20px,3vw,30px);margin:0 0 5px;line-height:1.25}
.subtitle{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,.seg button{border:1px solid var(--line);background:var(--input-bg);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
button:hover{border-color:#aeb7c4}
.seg{display:flex;background:#e8ebef;padding:3px;border-radius:12px}
.seg button{border:0;background:transparent;padding:7px 11px}
.seg button.active{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:var(--card);border:1px solid #e2e6ec;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-head{height:55px;min-height:55px;padding:0 18px;box-sizing:border-box;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h2{margin:0;font-size:16px}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef1f5;color:#4b5563;font-weight:700}
.badge.ok{background:#e8f7ef;color:var(--ok)}.badge.warn{background:#fff3e5;color:var(--warn)}
.table-wrap{overflow:auto}
.kb-table{width:100%;border-collapse:collapse;min-width:650px}
.kb-table th,.kb-table td{padding:8px;border-bottom:1px solid #edf0f3;border-right:1px solid #edf0f3;text-align:center;font-size:13px;white-space:nowrap}.kb-table th:nth-child(2),.kb-table th:nth-child(3){background:#f6f8fc}.kb-table th:nth-child(4),.kb-table th:nth-child(5){background:#f8f8fb}
.kb-table th{position:sticky;top:0;background:var(--surface-muted);z-index:2;font-size:12px;color:#4d5968}.kb-table .group-end{border-right:1.5px solid #c5ccd6!important}
.kb-table tr:last-child td{border-bottom:0}
.kb-table select{width:100%;min-width:120px}
.kb-table .method{min-width:82px}
.round-cell{width:58px;font-weight:800}
.delete-cell{width:54px}
.delete-btn{width:34px;height:34px;border-radius:9px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#8b95a3;background:#fff}
@media(hover:hover){.delete-btn:hover{color:var(--danger);border-color:#f0b8b3;background:#fff7f6}}
.delete-btn svg{width:16px;height:16px;pointer-events:none}
.add-row-wrap{padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-soft)}
.add-row-btn{width:100%;border-style:dashed;background:var(--input-bg);color:#4d5968}
.add-row-btn:hover{color:var(--accent);border-color:#aabbea;background:#f8faff}
select,input{border:1px solid #cfd5de;background:var(--input-bg);border-radius:8px;padding:8px 9px;color:var(--text);font:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,104,212,.12)}
select.dash-selected{color:var(--select-dash)}

/* Unified "-" appearance for KR/JP dropdowns */
.kb-table select.dash-selected,
#comboUsed.dash-selected{
  font-family:var(--font-kr)!important;
  font-weight:400!important;
  color:var(--select-dash)!important;
}

select option{color:var(--text)}
select option[value="none"],select option[value="-"]{color:#9aa2ae}
input[type=number]{width:100%;min-width:86px;text-align:right}
input::placeholder{color:rgba(27,31,36,.38);opacity:1}
.panel{padding:16px}
.form-grid{display:grid;grid-template-columns:1fr 120px 66px;column-gap:8px;row-gap:5px;align-items:center}
.form-grid>div{padding:3px 0}
.label{font-size:13px;font-weight:650}
.need{text-align:center;font-size:11px;font-weight:800}
.need.req{color:var(--danger)}.need.yes{color:#159b62}.need.no{color:#7b8491}
.divider{height:1px;background:var(--line);margin:14px 0}
.result-grid{display:grid;grid-template-columns:1fr;gap:10px}.result-grid-pair{grid-template-columns:1fr 1fr}
.result{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-soft)}
.result .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.result .v{font-size:20px;font-weight:850;word-break:break-word}
.result .v.small{font-size:16px}
.result.primary{background:var(--accent-soft);border-color:#cbd9ff}
.result.primary .v{color:#234fa8}
.combo-row{display:grid;grid-template-columns:1fr;gap:10px;align-items:end}
.combo-top-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.tolerance-row{display:grid;grid-template-columns:1fr;gap:10px}
.combo-row label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.combo-row select{width:100%}
.notice{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:#555f6d;font-size:12px;line-height:1.6}
.notice strong{color:var(--text)}
.footer{text-align:center;color:#7b8491;font-size:12px;margin-top:18px}.footer a{color:inherit;text-decoration:none;font-weight:700}.footer a:hover{text-decoration:underline}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418;
    --card:#1a1f25;
    --line:#343b45;
    --text:#f1f4f7;
    --muted:#a7b0bd;
    --accent:#79a6ff;
    --accent-soft:#1d2d4b;
    --danger:#ff8f87;
    --ok:#63d59a;
    --warn:#f0ad68;
    --shadow:0 10px 30px rgba(0,0,0,.28);
    --surface-soft:#20262d;
    --surface-muted:#222830;
    --surface-blue:#1c2635;
    --input-bg:#151a20;
    --select-dash:rgba(241,244,247,.42);
  }

  body{background:var(--bg);color:var(--text)}
  .card{border-color:#2d343d}
  .card-head{border-bottom-color:var(--line)}
  .seg{background:#303740}
  button{background:var(--input-bg);color:var(--text);border-color:var(--line)}
  .seg button{background:#303740;color:#cbd2db;border-color:transparent}
  .seg button.active{background:#505a66;color:#fff;border-color:#697583;box-shadow:0 1px 5px rgba(0,0,0,.28)}
  button:hover{border-color:#596473}
  .kb-table th,.kb-table td{border-bottom-color:#2b323a;border-right-color:#2b323a}
  .kb-table th{color:#c6ced8}
  .kb-table th:nth-child(2),.kb-table th:nth-child(3),
  .kb-table th:nth-child(4),.kb-table th:nth-child(5){background:#222830}
  .kb-table .group-end{border-right-color:#4b5563!important}
  .kb-table select,.combo-row select{background:var(--input-bg);color:var(--text)}

  .kb-table select{
    border-color:#3b434d;
  }

  select option{background:#151a20;color:var(--text)}
  select option[value="none"],select option[value="-"]{color:#818b98}
  input{background:var(--input-bg);color:var(--text);border-color:#46505d}
  input::placeholder{color:rgba(241,244,247,.38)}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(121,166,255,.16)}
  .delete-btn{background:var(--input-bg);color:#aeb6c1}
  @media(hover:hover){
    .delete-btn:hover{color:#ff9a93;border-color:#6b4442;background:#2b1d1d}
  }
  .add-row-wrap{background:#171c22;border-top-color:var(--line)}
  .add-row-btn{background:var(--input-bg);color:#b5bdc8}
  .add-row-btn:hover{color:#9cbbff;border-color:#536d9f;background:#182239}
  .result{border-color:var(--line)}
  .result.primary{background:var(--accent-soft);border-color:#38517f}
  .result.primary .v{color:#9bbcff}
  .notice{border-color:var(--line);color:#b6bfca}
  .notice strong{color:var(--text)}
  .footer{color:#8f99a6}

  .badge.ok{
    background:#173d2c;
    color:#7ee2ab;
    border:1px solid #2f7a56;
  }
  .badge.warn{
    background:#4a2d14;
    color:#ffc07a;
    border:1px solid #a5662c;
  }

  .need.yes{color:#6fdda5}
}


/* Japanese UI fine tuning */
html[lang="ja"] .footer,
html[lang="ja"] .footer *{font-family:var(--font-kr)!important}
html[lang="ja"] .title h1{font-size:calc(clamp(20px,3vw,30px) - 2px)}
html[lang="ja"] .subtitle{
  font-size:11.5px;
  margin-top:7px;
}
html[lang="ja"] #leadBadge{font-size:10.667px}


html[lang="ja"] #kbTitle{
  margin:0;
  line-height:1.2;
  display:flex;
  align-items:center;
  height:100%;
}


/* JP typography: keep Zen Maru Gothic, only add a very slight visual weight */
html[lang="ja"] body{ text-shadow:.035px 0 0 currentColor; }

html[lang="ja"] .form-grid .label,
html[lang="ja"] .form-grid .need,
html[lang="ja"] .jp-latin,
html[lang="ja"] .seg button,
html[lang="ja"] .form-grid input,
html[lang="ja"] .footer,
html[lang="ja"] .footer *{
  text-shadow:none;
}

/* Latin letters in JP mode use the same font as KR mode */
html[lang="ja"] .jp-latin{font-family:var(--font-kr);font-weight:400}


html[lang="ja"] #kbTitle{
  position:relative;
  top:-1.5px;
}
html[lang="ja"] #kbTitle .jp-latin{
  position:relative;
  top:1.5px;
  margin-right:0.18em;
}


html[lang="ko"] .form-grid .label{font-size:13.25px}


/* JP KB table: slightly heavier row numbers and dropdown text */
html[lang="ja"] .kb-table select{font-weight:550}




html[lang="ja"] .kb-table .round-cell{font-family:var(--font-kr)}


html[lang="ja"] .result .k{font-weight:740}
html[lang="ja"] .combo-row label{font-weight:740}


.reset-seg{
  font-family:var(--font-kr);
  border:0;
  background:#e8ebef;
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  font-weight:700;
  cursor:pointer;
}
.reset-seg:active{transform:none}
@media(prefers-color-scheme:dark){
  .reset-seg{background:#303740;color:#cbd2db}
}


html[lang="ja"] #resetBtn{font-weight:800}


html[lang="ko"] #rRequired,
html[lang="ko"] #rJumpRequired,
html[lang="ko"] #rComboNeed,
html[lang="ko"] #rJumpComboNeed{font-weight:530}
html[lang="ko"] #tolerance,
html[lang="ko"] #jumpTolerance{font-weight:530}


html[lang="ja"] #rRequired,
html[lang="ja"] #rJumpRequired{
  font-family:var(--font-kr);
  font-weight:530;
  text-shadow:.08px 0 0 currentColor;
}

/* Frame-jump suffix: inherit the original label font, only slightly smaller */
.jump-suffix{
  font:inherit;
  font-size:.74em;
  opacity:.70;
}
html[lang="ja"] .jump-suffix{font-size:.71em;}
html[lang="ja"] .jump-suffix .jump-jp-word{
  font-weight:550;
  text-shadow:none;
}


/* Enemy-side requirement indicator */
.enemy-value-suffix{
  font:inherit;
  font-size:.56em;
  font-weight:550;
  opacity:.62;
  margin-left:.38em;
  vertical-align:.08em;
}
.result.primary.enemy-primary{
  background:#fff0e6;
  border-color:#efb27f;
}
.result.primary.enemy-primary .v{color:#a94f12}

/* Make the footer link destination more obvious without changing its tone */
.youtube-link{display:inline-flex;align-items:center;gap:3px}
.external-link-icon{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;opacity:.72;flex:none}

/* JP-only small reduction for long generated result text */
html[lang="ja"] .jp-result-compact{font-size:15px!important}

@media(prefers-color-scheme:dark){
  .result.primary.enemy-primary{background:#3b261b;border-color:#87502f}
  .result.primary.enemy-primary .v{color:#ffb078}
}

@media(max-width:930px){
  .grid{grid-template-columns:1fr}
  .topbar{flex-direction:column}
  .actions{justify-content:flex-start}
  .combo-row{grid-template-columns:1fr}
  .combo-top-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tolerance-row{grid-template-columns:1fr}
  .combo-row > div,.combo-top-row > div,.tolerance-row > div{width:100%;min-width:0}
  .combo-row select{width:100%;min-width:0}
}
@media(max-width:620px){.app{padding:12px 10px 30px}.card{border-radius:13px}.form-grid{grid-template-columns:1fr 100px 52px}.card-head{height:55px;min-height:55px;padding:0 14px}.panel{padding:13px}}

@media(max-width:620px){
  .label{font-size:13px}
  html[lang="ko"] .form-grid .label{font-size:13.25px}
  .result .k{font-size:12px}
  .notice{font-size:12px}
  .footer{font-size:12px}
}


/* JP only: slightly smaller Frame 飛躍 suffix */
html[lang="ja"] .frame-jump-note{font-size:68%;}


/* Notice: very slight visual weight increase */
.notice{text-shadow:.055px 0 0 currentColor;}


/* JP only: notice typography */
html[lang="ja"] .notice{
  font-size:10.2px;
  font-weight:500;
  text-shadow:.23px 0 0 currentColor;
}


/* JP only: slightly smaller variable labels */
html[lang="ja"] .form-grid .label{font-size:12.5px;}


/* Footer: KR/JP use the same text appearance */
html[lang="ja"] .footer,
html[lang="ja"] .footer *{
  font-family:var(--font-kr)!important;
  font-weight:inherit;
}


.dev-tools-icon{
  display:inline-flex;
  width:12px;
  height:12px;
  margin-right:4.5px;
  
  align-items:center;
  justify-content:center;
  opacity:.86;
  display:inline-block;
  vertical-align:-0.148em;}
.dev-tools-icon svg{width:100%;height:100%;display:block}



/* KR/JP: ultra-subtle gap before frame-jump suffix */
.frame-jump-note{margin-left:.11em;}


/* JP only: tiny extra gap before frame-jump suffix */
html[lang="ja"] .frame-jump-note{margin-left:.17em;}


/* =========================================================
   UI EXPERIMENT — visual-only redesign layer
   Keeps calculation logic / labels / behavior intact
   ========================================================= */

:root{
  --ui-glow:rgba(53,104,212,.16);
  --ui-card-edge:rgba(53,104,212,.10);
  --ui-card-top:rgba(255,255,255,.72);
  --ui-card-bottom:rgba(248,250,253,.94);
  --ui-chip:rgba(53,104,212,.08);
}

body{
  background:
    radial-gradient(900px 420px at 50% -120px, rgba(53,104,212,.12), transparent 62%),
    linear-gradient(180deg, #f7f9fc 0%, var(--bg) 46%, #eef2f7 100%);
}

.app{
  max-width:1040px;
  padding-top:28px;
}

.topbar{
  align-items:center;
  margin-bottom:20px;
}

.title{
  position:relative;
}

.title h1{
  letter-spacing:-.025em;
  text-wrap:balance;
}

.subtitle{
  opacity:.86;
}

.actions{
  align-items:center;
}

.seg{
  padding:4px;
  border:1px solid rgba(53,104,212,.10);
  box-shadow:0 6px 18px rgba(20,28,45,.06);
  backdrop-filter:blur(10px);
}

.seg button,
.reset-seg{
  transition:transform .16s ease, box-shadow .16s ease, background-color .16s ease, border-color .16s ease;
}

.seg button.active{
  box-shadow:0 4px 12px rgba(20,28,45,.12), inset 0 0 0 1px rgba(255,255,255,.5);
}

.reset-seg{
  box-shadow:0 6px 18px rgba(20,28,45,.06);
}

@media(hover:hover){
  .seg button:hover,
  .reset-seg:hover{
    transform:translateY(-1px);
  }
}

.grid{
  gap:18px;
}

.card{
  border:1px solid rgba(126,139,158,.20);
  border-radius:18px;
  background:
    linear-gradient(180deg, var(--ui-card-top), var(--ui-card-bottom));
  box-shadow:
    0 18px 50px rgba(20,28,45,.08),
    0 2px 10px rgba(20,28,45,.035);
  backdrop-filter:blur(12px);
}

.card-head{
  height:58px;
  min-height:58px;
  padding:0 20px;
  background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.04));
}

.card-head h2{
  letter-spacing:-.018em;
}

.badge{
  border:1px solid rgba(100,112,130,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}

.table-wrap{
  background:linear-gradient(180deg, rgba(255,255,255,.36), transparent 110px);
}

.kb-table th{
  backdrop-filter:blur(10px);
}

.kb-table td{
  background:rgba(255,255,255,.22);
}

.kb-table tr:hover td{
  background:rgba(53,104,212,.025);
}

select,input{
  border-radius:10px;
  border-color:rgba(126,139,158,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease, background-color .15s ease;
}

select:hover,input:hover{
  border-color:rgba(53,104,212,.38);
}

select:focus,input:focus{
  transform:translateY(-1px);
  box-shadow:0 0 0 4px rgba(53,104,212,.10), 0 6px 16px rgba(20,28,45,.06);
}

.delete-btn{
  transition:transform .14s ease, background-color .14s ease, border-color .14s ease;
}
@media(hover:hover){
  .delete-btn:hover{transform:scale(1.04)}
}

.add-row-wrap{
  padding:13px 15px 15px;
  background:linear-gradient(180deg, rgba(248,250,253,.30), rgba(248,250,253,.74));
}

.add-row-btn{
  min-height:39px;
  border-width:1px;
  border-style:dashed;
  border-color:rgba(53,104,212,.30);
  background:rgba(53,104,212,.035);
}

.panel{
  padding:18px;
}

.form-grid{
  row-gap:7px;
}

.form-grid>div{
  padding:4px 0;
}

.need{
  border-radius:999px;
  padding:3px 6px;
  justify-self:center;
  min-width:42px;
}
.need.req{background:rgba(180,35,24,.07)}
.need.yes{background:rgba(6,118,71,.07)}
.need.no{background:rgba(123,132,145,.08)}

.result-grid{
  gap:12px;
}

.result{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  padding:13px 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.68), rgba(248,250,253,.74));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.70),
    0 6px 16px rgba(20,28,45,.035);
}

.result::after{
  content:"";
  position:absolute;
  inset:auto -24px -30px auto;
  width:70px;
  height:70px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(53,104,212,.07), transparent 68%);
  pointer-events:none;
}

.result.primary{

/* =========================================================
   UI EXPERIMENT v4 — overall polish pass
   ========================================================= */

:root{
  --radius-card:20px;
  --radius-control:11px;
  --ease-ui:cubic-bezier(.2,.75,.25,1);
}

/* global rhythm */
body{
  min-height:100vh;
  background-attachment:fixed;
}

.app{
  position:relative;
}

.title h1{
  letter-spacing:-.03em;
  text-shadow:0 1px 0 rgba(255,255,255,.28);
}

.subtitle{
  letter-spacing:-.01em;
}

/* Cards */
.card{
  border-radius:var(--radius-card);
  transition:
    transform .22s var(--ease-ui),
    box-shadow .22s var(--ease-ui),
    border-color .22s var(--ease-ui);
}

@media(hover:hover){
  .card:hover{
    transform:translateY(-1px);
  }
}

.card-head{
  position:relative;
}

.card-head::after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(90,110,140,.18),transparent);
  pointer-events:none;
}

/* Inputs */
select,input{
  border-radius:var(--radius-control);
  min-height:38px;
}

select{
  background-position:right 10px center;
}

.form-grid input{
  font-variant-numeric:tabular-nums;
}

.label{
  letter-spacing:-.01em;
}

/* status pills */
.need{
  font-size:10.5px;
  min-width:44px;
  padding:4px 7px;
  border:1px solid transparent;
}

.need.req{border-color:rgba(180,35,24,.08)}
.need.yes{border-color:rgba(6,118,71,.08)}
.need.no{border-color:rgba(123,132,145,.08)}

/* result hierarchy */
.result-grid{
  align-items:stretch;
}

.result{
  isolation:isolate;
  transition:
    transform .18s var(--ease-ui),
    box-shadow .18s var(--ease-ui),
    border-color .18s var(--ease-ui);
}

@media(hover:hover){
  .result:hover{
    transform:translateY(-1px);
  }
}

.result .k{
  letter-spacing:-.012em;
}

.result .v{
  line-height:1.08;
}

.result.primary .v{
  font-size:21px;
}

.result.primary::before{
  border-radius:2px;
}

/* subtle top shine */
.result::before{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);
  opacity:.7;
  pointer-events:none;
}

/* but preserve colored rail on primary */
.result.primary::before{
  left:0;
  right:auto;
  top:0;
  bottom:0;
  width:3px;
  height:auto;
  opacity:.9;
}

/* Combo area */
.combo-row{
  align-items:stretch;
}

.combo-row > div:first-child{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.combo-row select{
  min-height:40px;
}

/* buttons */
button,.seg button,.reset-seg{
  transition:
    transform .16s var(--ease-ui),
    box-shadow .16s var(--ease-ui),
    background-color .16s var(--ease-ui),
    border-color .16s var(--ease-ui),
    color .16s var(--ease-ui);
}

@media(hover:hover){
  button:hover,.seg button:hover,.reset-seg:hover{
    transform:translateY(-1px);
  }
  button:active,.seg button:active,.reset-seg:active{
    transform:translateY(0);
  }
}

.add-row-btn{
  border-radius:12px;
  letter-spacing:-.01em;
}

.delete-btn{
  border-radius:10px;
}

/* badge */
.badge{
  backdrop-filter:blur(8px);
}

/* notice */
.notice{
  border-radius:17px;
  padding-left:17px;
}

/* footer */
.footer{
  letter-spacing:-.01em;
}

/* =========================================================
   UI EXPERIMENT v5 — refinement pass
   cleaner hierarchy, more premium surfaces, less visual noise
   ========================================================= */

:root{
  --ui-blue:#4f7ed8;
  --ui-blue-soft:#eaf1ff;
  --ui-orange:#d97836;
  --ui-radius-xl:20px;
  --ui-radius-lg:14px;
}

/* typography rhythm */
.title h1{
  font-feature-settings:"kern";
  text-rendering:optimizeLegibility;
}

.card-head h2,
.result .k,
.combo-row label,
.label{
  text-rendering:optimizeLegibility;
}

/* topbar: flatter, cleaner, more deliberate */
.topbar{
  gap:18px;
}

.actions{
  gap:9px;
}

.seg,
.reset-seg{
  backdrop-filter:blur(14px);
}

/* card shell */
.card{
  overflow:hidden;
  isolation:isolate;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    linear-gradient(135deg,rgba(255,255,255,.09),transparent 22%),
    linear-gradient(315deg,rgba(255,255,255,.035),transparent 20%);
  opacity:.6;
}

.card-head{
  z-index:1;
}

.card-head h2{
  position:relative;
  z-index:1;
}

/* subtle header marker */
.card-head h2::before{
  content:"";
  display:inline-block;
  width:4px;
  height:13px;
  margin-right:8px;
  border-radius:999px;
  background:linear-gradient(180deg,var(--accent),rgba(53,104,212,.35));
  vertical-align:-1px;
  opacity:.88;
}

/* table */
.kb-table th,
.kb-table td{
  transition:background-color .14s ease,border-color .14s ease;
}

.kb-table tbody tr{
  transition:filter .14s ease;
}

@media(hover:hover){
  .kb-table tbody tr:hover{
    filter:brightness(1.01);
  }
}

/* inputs cleaner and more tactile */
select,input{
  position:relative;
  z-index:0;
}

select:focus,input:focus{
  z-index:2;
}

.form-grid{
  row-gap:8px;
}

.form-grid .label{
  opacity:.96;
}

.form-grid input{
  min-height:39px;
}

/* status chips more coherent */
.need{
  border-radius:999px;
  min-width:46px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24);
}

/* result section becomes focal point */
.result-card .panel{
  position:relative;
}

.result-card .panel::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(360px 180px at 50% 0%,rgba(79,126,216,.055),transparent 72%);
}

.result-grid{
  position:relative;
  z-index:1;
}

.result{
  min-height:76px;
}

.result .k{
  margin-bottom:6px;
}

.result .v{
  position:relative;
  z-index:2;
}

.result.primary{
  min-height:82px;
}

.result.primary .v{
  font-size:22px;
}

/* result top accent glow */
.result.primary::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-38px;
  top:-42px;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
}

/* combo section */
.combo-row{
  position:relative;
  z-index:1;
}

.combo-row label{
  margin-bottom:6px;
}

/* notice/footer */
.notice{
  border-left-width:1px;
}

.notice strong{
  letter-spacing:-.015em;
}

.footer{
  user-select:none;
}

 const o10=state.rows.some(r=>r.am==='direct');
 const o11=state.rows.some(r=>r.em==='direct');

 return {L,rows,ec,ac,eDist,eAir,aDist,aAir,moves,frontMin,frontMax,finalDistance,jumpFinalDistance,finalFrames,required,jumpRequired,comboNeed,jumpComboNeed,rate,tol,jumpTol,front,o9,o10,o11};
}

function mapOptions(map,selected){
 return Object.keys(map).map(k=>`<option value="${k}" ${k===selected?'selected':''}>${map[k]}</option>`).join('');
}
function methodOptions(t,selected){
 return `<option value="-" ${selected==='-'?'selected':''}>-</option><option value="direct" ${selected==='direct'?'selected':''}>${t.direct}</option>`;
}
function setDashClass(el){
 if(!el)return;
 const isDash=(el.value==='none'||el.value==='-');
 el.classList.toggle('dash-selected',isDash);
}


function buildComboOptions(t,unavailableMode=false){
 if(unavailableMode){
  return `<option value="none" ${state.combo==='none'?'selected':''}>-</option><option value="unavailable" disabled>${t.unavailable}</option>`;
 }
 return mapOptions(t.comboNames,state.combo);
}

function buildRows(){
 const t=T[state.lang],body=$('kbBody');
 body.innerHTML='';
 state.rows.forEach((r,i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`
   <td class="round-cell group-end">${i+1}</td>
   <td><select data-i="${i}" data-f="e">${mapOptions(t.enemyNames,r.e)}</select></td>
   <td class="group-end"><select class="method" data-i="${i}" data-f="em">${methodOptions(t,r.em)}</select></td>
   <td><select data-i="${i}" data-f="a">${mapOptions(t.allyNames,r.a)}</select></td>
   <td class="group-end"><select class="method" data-i="${i}" data-f="am">${methodOptions(t,r.am)}</select></td>
   <td class="delete-cell"><button class="delete-btn" data-delete="${i}" aria-label="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 10v6"/><path d="M14 10v6"/>
    </svg>
   </button></td>`;
  body.appendChild(tr);
 });

 body.querySelectorAll('select').forEach(s=>{
  setDashClass(s);
  s.onchange=e=>{
   const i=+e.target.dataset.i,f=e.target.dataset.f;
   state.rows[i][f]=e.target.value;
   setDashClass(e.target);
   save();update();
  };
 });
 body.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{
  b.blur();
  const i=+b.dataset.delete;
  if(state.rows.length===1)state.rows[0]=blankRow();
  else state.rows.splice(i,1);
  save();
  requestAnimationFrame(()=>render());
 });
}

function buildVars(){
 const t=T[state.lang],C=calc();
 const labels=[
  C.front==='ally'?t.allyFront:t.enemyFront,
  t.enemyRear,
  C.L==='enemy'?t.enemySpeed:t.allySpeed,
  C.L==='enemy'?t.allySpeed:t.enemySpeed,
  t.enemyEnd,
  t.allyEnd
 ];
 const keys=['allyFront','enemyRear','speedA','speedB','enemyEnd','allyEnd'];
 const need=[true,true,true,C.o9,C.o10,C.o11];
 $('varGrid').innerHTML=keys.map((k,i)=>{
  const alwaysRequired=i<3;
  const conditionalNeeded=i>=3&&need[i];
  const cls=alwaysRequired?'req':conditionalNeeded?'yes':'no';
  const txt=alwaysRequired?t.required:conditionalNeeded?t.needed:t.notNeeded;
  return `
  <div class="label">${labels[i]}</div>
  <div><input type="number" inputmode="decimal" step="any" placeholder="-" data-var="${k}" value="${state.vars[k]}"></div>
  <div class="need ${cls}">${txt}</div>`}).join('');
 $('varGrid').querySelectorAll('input').forEach(x=>x.oninput=e=>{
  state.vars[e.target.dataset.var]=e.target.value;
  save();update(false);
 });
}


function setMixedJPText(el,text){
 if(state.lang!=='jp'){el.textContent=text;return}
 const parts=String(text).split(/([A-Za-z]+(?:[0-9]+)?|[0-9]+[A-Za-z]+)/g);
 el.replaceChildren(...parts.filter(Boolean).map(part=>{
  if(/[A-Za-z]/.test(part)){
   const s=document.createElement('span');
   s.className='jp-latin';
   s.textContent=part;
   return s;
  }
  return document.createTextNode(part);
 }));
}




function setJumpLabel(el,text){
 const m=String(text).match(/^(.*?)([\u2000-\u200A\u202F\u205F\u3000 ]*)(\([^)]*\))$/);
 if(!m){el.textContent=text;return}
 el.replaceChildren(document.createTextNode(m[1]+m[2]));
 const span=document.createElement('span');
 span.className='jump-suffix';
 if(state.lang==='jp' && m[3].includes('Frame\u2006飛躍')){
  const content=m[3].slice(1,-1);
  const parts=content.split('飛躍');
  span.appendChild(document.createTextNode('('+parts[0]));
  const jpWord=document.createElement('span');
  jpWord.className='jump-jp-word';
  jpWord.textContent='飛躍';
  span.appendChild(jpWord);
  span.appendChild(document.createTextNode(')'));
 }else{
  span.textContent=m[3];
 }
 el.appendChild(span);
}

function setResultWithEnemySuffix(el,value,isEnemy,t){
 el.replaceChildren(document.createTextNode(value));
 if(!isEnemy)return;
 const span=document.createElement('span');
 span.className='enemy-value-suffix';
 span.textContent=state.lang==='jp'?'(敵側)':'(적군)';
 el.appendChild(span);
}

function applyText(){
 const t=T[state.lang];
 document.documentElement.lang=state.lang==='kr'?'ko':'ja';
 document.title=t.title;
 $('title').textContent=t.title;setMixedJPText($('subtitle'),t.subtitle);setMixedJPText($('kbTitle'),t.kbTitle);
 $('hRound').textContent=t.round;setMixedJPText($('hEnemyKb'),t.enemyKb);$('hEnemyMethod').textContent=t.method;
 setMixedJPText($('hAllyKb'),t.allyKb);$('hAllyMethod').textContent=t.method;$('hDelete').textContent=t.deleteLabel;
 $('resetBtn').textContent=t.reset;$('addRowBtn').textContent=t.addRound;$('varSectionTitle').textContent=t.varSectionTitle;$('resultSectionTitle').textContent=t.resultSectionTitle;
 
 $('rComboNeedLabel').textContent=t.comboNeed;
 setJumpLabel($('rJumpRequiredLabel'),t.jumpRequired);
 setJumpLabel($('rJumpComboNeedLabel'),t.jumpComboNeed);
 setJumpLabel($('jumpToleranceLabel'),t.jumpTolerance);
 $('comboUsedLabel').textContent=t.comboUsed;$('comboRateLabel').textContent=t.comboRate;$('toleranceLabel').textContent=t.tolerance;
 $('notice').innerHTML=t.notice;$('footerMaker').textContent=t.footerMaker;
 $('langKR').classList.toggle('active',state.lang==='kr');$('langJP').classList.toggle('active',state.lang==='jp');
 $('comboUsed').innerHTML=buildComboOptions(t,false);
 setDashClass($('comboUsed'));
}

function update(rebuildVars=true){
 const t=T[state.lang],c=calc();

 const comboUnavailable=(c.comboNeed==='unavailable');
 if(comboUnavailable && state.combo!=='none'){
  state.combo='none';
  save();
 }
 $('comboUsed').innerHTML=buildComboOptions(t,comboUnavailable);
 $('comboUsed').value='none';
 if(!comboUnavailable) $('comboUsed').value=state.combo;
 setDashClass($('comboUsed'));
 
 setMixedJPText($('leadBadge'),c.L==='none'?t.leadNone:c.L==='ally'?t.leadAlly:t.leadEnemy);
 $('leadBadge').className='badge '+(c.L==='none'?'':c.L==='ally'?'ok':'warn');
 $('rRequiredLabel').textContent=t.minRequired;
 setResultWithEnemySuffix($('rRequired'),fmt(c.required),c.L==='enemy',t);
 setResultWithEnemySuffix($('rJumpRequired'),fmt(c.jumpRequired),c.L==='enemy',t);
 $('requiredCard').classList.toggle('enemy-primary',c.L==='enemy');
 $('jumpRequiredCard').classList.toggle('enemy-primary',c.L==='enemy');
 
 const cn=c.comboNeed;
 $('rComboNeed').textContent=cn==='-'?'-':cn==='unavailable'?t.unavailable:cn==='unneeded'?t.unneeded:cn==='impossible'?t.impossible:t.comboNames[cn];
 const jcn=c.jumpComboNeed;
 $('rJumpComboNeed').textContent=jcn==='-'?'-':jcn==='unavailable'?t.unavailable:jcn==='unneeded'?t.unneeded:jcn==='impossible'?t.impossible:t.comboNames[jcn];
 if(comboUnavailable){
  $('comboRateMain').textContent=t.unavailable;
 }else if(state.combo==='none'){
  $('comboRateMain').textContent='-';
 }else{
  const multiplier=DATA.combo[state.combo];
  const percent=Math.round((multiplier-1)*100);
  {
   $('comboRateMain').textContent=`${percent}%`;
 }
 }
 $('tolerance').textContent=c.tol==='impossible'?t.impossible:c.tol;
 $('jumpTolerance').textContent=c.jumpTol==='impossible'?t.impossible:c.jumpTol;
 const jp=state.lang==='jp';
 $('rComboNeed').classList.toggle('jp-result-compact',jp&&$('rComboNeed').textContent!=='-');
 $('rJumpComboNeed').classList.toggle('jp-result-compact',jp&&$('rJumpComboNeed').textContent!=='-');
 $('tolerance').classList.toggle('jp-result-compact',jp&&c.tol==='impossible');
 $('jumpTolerance').classList.toggle('jp-result-compact',jp&&c.jumpTol==='impossible');
 if(rebuildVars)buildVars();
}

function normalizeLoaded(x){
 if(!x||!Array.isArray(x.rows)||x.rows.length<1)return false;
 state.lang=x.lang==='jp'?'jp':'kr';
 state.rows=x.rows.map(r=>({
  e:DATA.enemy[r.e]?r.e:'none',
  em:r.em==='direct'?'direct':'-',
  a:DATA.ally[r.a]?r.a:'none',
  am:r.am==='direct'?'direct':'-'
 }));
 state.vars={...state.vars,...(x.vars||{})};
 for(const k of Object.keys(state.vars))if(state.vars[k]===0)state.vars[k]='';
 state.combo=DATA.combo[x.combo]!==undefined?x.combo:'none';
 return true;
}
function resetAllInputs(){
 const currentLang=state.lang;

 // 모든 입력/선택값을 초기 상태로 복구
 state.rows=[blankRow()];
 state.vars={
  allyFront:'',
  enemyRear:'',
  speedA:'',
  speedB:'',
  enemyEnd:'',
  allyEnd:''
 };
 state.combo='none';
 state.lang=currentLang;

 try{ localStorage.removeItem('battleCatsPassCalcV7'); }catch(e){}

 // 현재 보이는 숫자 입력칸도 즉시 비움
 document.querySelectorAll('#varGrid input').forEach(input=>{input.value='';});

 // 화면 전체를 초기 상태로 다시 그림
 render();

 // 초기화된 상태를 저장
 try{ save(); }catch(e){}
}

function save(){localStorage.setItem('battleCatsPassCalcV7',JSON.stringify(state))}
function load(){try{normalizeLoaded(JSON.parse(localStorage.getItem('battleCatsPassCalcV7')))}catch(e){}state.lang='kr'}
function render(){applyText();buildRows();buildVars();update(false)}

$('comboUsed').onchange=e=>{
 if(e.target.value==='unavailable'){
  state.combo='none';
  e.target.value='none';
 }else{
  state.combo=e.target.value;
 }
 setDashClass(e.target);
 save();
 update(false);
};
$('addRowBtn').onclick=()=>{state.rows.push(blankRow());save();render()};
$('langKR').onclick=()=>{state.lang='kr';save();render()};
$('langJP').onclick=()=>{state.lang='jp';save();render()};
load();render();

</script>
</body>
</html>
